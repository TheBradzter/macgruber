name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle and validates the committed Gradle wrapper.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MacGruberSoundboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MacGruberSoundboard-apk
          path: MacGruberSoundboard.apk

      # Every push to main publishes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/MacGruberSoundboard.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MacGruberSoundboard.apk \
            --target "${{ github.sha }}" \
            --title "MacGruber Soundboard 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Open this page on your phone and tap MacGruberSoundboard.apk to install." \
            --latest

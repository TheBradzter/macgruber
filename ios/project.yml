# Generate MacGruber.xcodeproj with XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: MacGruber
options:
  bundleIdPrefix: com.thebradzter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MacGruber:
    type: application
    platform: iOS
    sources:
      - path: MacGruber
    settings:
      base:
        PRODUCT_NAME: MacGruber
        PRODUCT_BUNDLE_IDENTIFIER: com.thebradzter.macgruber
        INFOPLIST_FILE: MacGruber/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - MacGruberTests
  MacGruberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacGruberTests
    dependencies:
      - target: MacGruber
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebradzter.macgruber.tests
        GENERATE_INFOPLIST_FILE: YES
